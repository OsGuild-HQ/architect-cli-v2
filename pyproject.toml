[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "architect-cli"
version = "2.0.0"
description = "Architect — a terminal AI coding assistant for any OpenAI-compatible API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Open-Source Guild" }]
requires-python = ">=3.13"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "openai>=2.37.0,<4",
    "textual>=8.2.6",
    "rich>=14.0.0",
    "pathspec>=0.12.1",
    "regex>=2024.11.6",
]

[project.urls]
Homepage = "https://github.com/sadeeqrabiu/architect-cli-v2"

[project.scripts]
architect = "architect.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["src/architect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001", "RUF012"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
